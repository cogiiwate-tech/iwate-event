<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岩手県イベント情報｜こぎの岩手カレンダー</title>
<meta name="description" content="岩手県のイベントを日付ごとに一覧で。イベント名を押すと、日時・場所・公式ページが見られます。">
<link rel="icon" href="icon.webp">
<style>
  :root {
    --maroon: #672E38;
    --maroon-dark: #4A1F27;
    --ink: #3A2A2C;
    --sub: #7A6468;
    --line: #EADDE0;
    --paper: #FFFFFF;
    --bg1: #FBEFF3;
    --bg2: #F6F1E7;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg1), var(--bg2)) fixed;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  a { color: inherit; }

  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--maroon); color: #fff;
    text-align: center; padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .top h1 { margin: 0; font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; letter-spacing: .04em; line-height: 1.2; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }

  .intro {
    display: flex; gap: 12px; align-items: center;
    background: var(--paper); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 2px 6px rgba(80,40,50,.10);
  }
  .intro img { width: 68px; height: 68px; flex: none; object-fit: contain; }
  .intro p { margin: 0; font-size: 15px; font-weight: 700; }
  .intro small { display: block; font-weight: 400; color: var(--sub); font-size: 12.5px; margin-top: 2px; }

  .filter { margin: 14px 0 4px; display: flex; gap: 10px; align-items: center; }
  .filter label { font-weight: 700; font-size: 15px; flex: none; }
  .filter select {
    flex: 1; min-width: 0; font: inherit; font-weight: 700; color: var(--ink);
    padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper);
  }

  .search { position: relative; margin: 14px 0 0; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
    padding: 12px 48px 12px 44px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper);
    -webkit-appearance: none; appearance: none;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search::before {
    content: ""; position: absolute; left: 16px; top: 50%; width: 13px; height: 13px; margin-top: -9px;
    border: 3px solid var(--sub); border-radius: 50%;
  }
  .search::after {
    content: ""; position: absolute; left: 29px; top: 50%; width: 3px; height: 8px; margin-top: 3px;
    background: var(--sub); border-radius: 2px; transform: rotate(-45deg);
  }
  .search button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: 0; border-radius: 50%; background: #F1E4E7; color: var(--maroon);
    font-size: 20px; font-weight: 900; cursor: pointer;
  }
  .result-note { margin: 16px 2px 0; font-weight: 800; color: var(--maroon); }
  .result-date { font-size: 13.5px; font-weight: 800; color: var(--sub); margin: 4px 4px -2px; }
  .result-date.past { color: #9C8C8F; }
  .more { margin-top: 10px; width: 100%; font: inherit; cursor: pointer; }
  .views {
    display: flex; margin: 14px 0 0; padding: 4px; gap: 4px;
    background: var(--paper); border-radius: 14px; box-shadow: 0 2px 6px rgba(80,40,50,.10);
  }
  .views button {
    flex: 1; font: inherit; font-weight: 800; font-size: 16px; color: var(--maroon);
    min-height: 46px; border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--maroon); color: #fff; }

  .cal { margin-top: 16px; background: var(--paper); border-radius: 16px; padding: 12px 8px 10px; box-shadow: 0 2px 6px rgba(80,40,50,.12); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .cal-head h2 { margin: 0; font-size: 20px; font-weight: 900; color: var(--maroon); }
  .cal-head button {
    font: inherit; font-weight: 900; font-size: 15px; color: var(--maroon);
    min-width: 76px; min-height: 42px; border-radius: 10px; border: 2px solid var(--line); background: #fff; cursor: pointer;
  }
  .cal-head button:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .wk { text-align: center; font-size: 13px; font-weight: 800; color: var(--sub); padding-bottom: 2px; }
  .wk.sun, .cell.sun .num { color: #C62848; }
  .wk.sat, .cell.sat .num { color: #1F5FC9; }
  .cell {
    font: inherit; color: var(--ink); text-align: center; border: 0; padding: 4px 0 5px;
    min-height: 62px; border-radius: 10px; background: #FAF5F6;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .cell.blank { background: transparent; }
  .cell.past { opacity: .35; }
  .cell.has { cursor: pointer; background: #F6E9EC; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--maroon); }
  .cell.sel { background: var(--maroon); }
  .cell.sel .num, .cell.sel .cnt { color: #fff; }
  .cell .num { font-size: 17px; font-weight: 800; line-height: 1.2; }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 40px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.8); }
  .cnt { font-size: 11px; font-weight: 800; color: var(--maroon); line-height: 1; }
  .cal-note { margin: 8px 4px 0; font-size: 12.5px; color: var(--sub); }

  .sec-title { margin: 22px 0 8px; font-size: 16px; font-weight: 900; color: var(--maroon); }

  .day { margin-top: 20px; }
  .day-head { display: flex; align-items: center; gap: 12px; margin-bottom: -14px; position: relative; z-index: 1; padding-left: 4px; }
  .badge {
    width: 92px; height: 92px; border-radius: 50%; flex: none; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; line-height: 1.05;
    box-shadow: 0 3px 8px rgba(0,0,0,.22);
    background: linear-gradient(135deg, #8C7A7D, #5E4D50);
  }
  .badge .md { font-size: 23px; }
  .badge .wd { font-size: 13px; margin-top: 3px; }
  .badge.sat { background: linear-gradient(200deg, #3FD3E6, #2A6FD6 55%, #1B1FBE); }
  .badge.sun { background: linear-gradient(200deg, #E0447F, #C2488C 55%, #B0569A); }
  .day-note { font-weight: 900; color: var(--maroon); font-size: 15px; padding-bottom: 14px; }

  .panel {
    background: var(--paper); border-radius: 16px; padding: 6px;
    box-shadow: 0 2px 6px rgba(80,40,50,.12);
    display: flex; flex-direction: column; gap: 6px;
  }
  .day .panel { padding-top: 22px; }

  details.ev { border-radius: 10px; }
  details.ev > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    min-height: 52px; padding: 9px 12px 9px 14px;
    border-radius: 10px; color: #fff; font-weight: 800; font-size: 17px; line-height: 1.35;
    background: var(--c);
    box-shadow: 2px 3px 5px rgba(0,0,0,.28);
  }
  details.ev > summary::-webkit-details-marker { display: none; }
  details.ev > summary:focus-visible { outline: 3px solid #222; outline-offset: 2px; }
  details.ev.dark-text > summary { color: #3A2A00; }
  .ttl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tag {
    display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 6px;
    background: rgba(255,255,255,.92); color: #8A1C1C; font-size: 13px; font-weight: 900; vertical-align: 2px;
  }
  .chev { flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.28); position: relative; }
  .chev::before {
    content: ""; position: absolute; left: 8px; top: 6px; width: 8px; height: 8px;
    border-right: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(45deg);
    transition: transform .15s;
  }
  details[open] .chev::before { transform: rotate(-135deg); top: 10px; }
  @media (prefers-reduced-motion: reduce) { .chev::before { transition: none; } }

  .body { padding: 12px 10px 14px; border-left: 5px solid var(--c); margin: 6px 2px 4px 6px; }
  .row { display: flex; gap: 10px; margin-bottom: 8px; }
  .row .k {
    flex: none; width: 4.6em; text-align: center; align-self: flex-start;
    font-size: 13px; font-weight: 800; color: var(--maroon);
    background: #F6E9EC; border-radius: 6px; padding: 2px 4px; margin-top: 2px;
  }
  .row .v { flex: 1; min-width: 0; white-space: pre-line; overflow-wrap: anywhere; font-size: 15.5px; }
  .map { display: inline-block; margin-top: 2px; font-size: 14px; font-weight: 700; color: #1A5FB4; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 10px 14px; border-radius: 12px;
    background: var(--maroon); color: #fff; text-decoration: none; font-weight: 800; font-size: 16px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .btn.sub { background: #fff; color: var(--maroon); border: 2px solid var(--maroon); box-shadow: none; }
  .btn::after { content: "↗"; font-weight: 900; }
  .hint { margin: 8px 0 0; font-size: 12.5px; color: var(--sub); }

  .empty { background: var(--paper); border-radius: 16px; padding: 24px 16px; text-align: center; margin-top: 20px; font-weight: 700; }

  footer { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .notice {
    background: var(--paper); border-radius: 16px; padding: 14px 16px; font-weight: 800; text-align: center;
    box-shadow: 0 2px 6px rgba(80,40,50,.10);
  }
  .links { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .credit { text-align: center; color: var(--sub); font-size: 12.5px; margin-top: 16px; }
</style>
</head>
<body>

<header class="top"><h1>岩手県イベント情報</h1></header>

<main>
  <div class="intro">
    <img src="icon.webp" alt="こぎ">
    <p>イベント名を押すと、くわしい情報と公式ページが見られます。
      <small id="updated"></small>
    </p>
  </div>

  <form class="search" role="search" id="search-form">
    <input type="search" id="q" placeholder="イベント名・市町村で検索" aria-label="イベント名・市町村で検索" autocomplete="off" enterkeyhint="search">
    <button type="button" id="q-clear" aria-label="検索をやめる" hidden>×</button>
  </form>

  <div class="views" role="group" aria-label="表示の切り替え">
    <button type="button" id="v-list" aria-pressed="true">日付ごとの一覧</button>
    <button type="button" id="v-cal" aria-pressed="false">月のカレンダー</button>
  </div>

  <div class="filter">
    <label for="muni">市町村</label>
    <select id="muni"><option value="">すべての市町村</option></select>
  </div>

  <div id="cal"></div>
  <div id="list"></div>
</main>

<footer>
  <div class="notice">おでかけ前には必ず公式ページを確認してください♪</div>
  <div class="links">
    <a class="btn sub" href="https://www.instagram.com/cogi766/" target="_blank" rel="noopener">こぎのInstagram（@cogi766）</a>
    <a class="btn sub" href="https://calendar.google.com/calendar/embed?src=cogi.kaicho%40gmail.com&ctz=Asia%2FTokyo" target="_blank" rel="noopener">カレンダーで全部の予定を見る</a>
  </div>
  <p class="credit">こぎの岩手カレンダー</p>
</footer>

<script src="events.js"></script>
<script>
(function () {
  var DATA = window.IWATE_EVENTS || { events: [], updated: "" };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  var LIGHT_BARS = { "#F6BF26": true };   // 白い字が読みにくい色は、こげ茶の字にする
  var list = document.getElementById("list");
  var sel = document.getElementById("muni");

  function iso(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function toDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function md(s) { var d = toDate(s); return (d.getMonth() + 1) + "/" + d.getDate(); }

  var now = new Date();
  var today = iso(now), tomorrow = iso(addDays(now, 1));

  function service(url) {
    var h = "";
    try { h = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
    if (/instagram\.com$/.test(h)) return "Instagram";
    if (/facebook\.com$|fb\.me$/.test(h)) return "Facebook";
    if (/^(x|twitter)\.com$/.test(h)) return "X";
    if (/threads\.(net|com)$/.test(h)) return "Threads";
    if (/youtube\.com$|youtu\.be$/.test(h)) return "YouTube";
    if (/\.pdf($|\?)/i.test(url)) return "PDF";
    return "";
  }

  function linkLabel(key, link) {
    var base = link.label || (key === "公式" || !key ? "公式ページ" : key);
    var sv = service(link.url);
    if (sv && base.toLowerCase().indexOf(sv.toLowerCase()) < 0) base += "（" + sv + "）";
    return base + "を見る";
  }

  function eventNode(ev, dayIso) {
    var d = el("details", "ev" + (LIGHT_BARS[ev.color] ? " dark-text" : ""));
    d.style.setProperty("--c", ev.color);
    var s = el("summary");
    var t = el("span", "ttl");
    if (ev.tag) t.appendChild(el("span", "tag", ev.tag));
    t.appendChild(document.createTextNode((ev.muni ? "【" + ev.muni + "】" : "") + ev.name));
    s.appendChild(t);
    s.appendChild(el("span", "chev"));
    d.appendChild(s);

    var b = el("div", "body");
    if (ev.e !== ev.s) {
      var r0 = el("div", "row");
      r0.appendChild(el("span", "k", "期間"));
      r0.appendChild(el("span", "v", md(ev.s) + "（" + WD[toDate(ev.s).getDay()] + "）〜 " + md(ev.e) + "（" + WD[toDate(ev.e).getDay()] + "）"));
      b.appendChild(r0);
    }
    var links = [], hasInsta = false;
    ev.f.forEach(function (f) {
      if (f.t) {
        var r = el("div", "row");
        r.appendChild(el("span", "k", f.k || "メモ"));
        var v = el("span", "v", f.t);
        if (f.k === "場所" || f.k === "会場") {
          var q = (ev.muni ? "岩手県" + ev.muni + " " : "岩手県 ") + f.t.split("\n")[0];
          var a = el("a", "map", "地図で見る ↗");
          a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
          a.target = "_blank"; a.rel = "noopener";
          v.appendChild(document.createElement("br"));
          v.appendChild(a);
        }
        r.appendChild(v);
        b.appendChild(r);
      }
      (f.u || []).forEach(function (u) {
        if (/^https?:\/\//.test(u.url)) links.push({ key: f.k, link: u });
      });
    });
    if (links.length) {
      var box = el("div", "btns");
      links.forEach(function (x, i) {
        var a = el("a", "btn" + (i ? " sub" : ""), linkLabel(x.key, x.link));
        a.href = x.link.url; a.target = "_blank"; a.rel = "noopener";
        if (service(x.link.url) === "Instagram") hasInsta = true;
        box.appendChild(a);
      });
      b.appendChild(box);
      if (hasInsta) b.appendChild(el("p", "hint", "※Instagramのリンクは、ログイン画面が出ることがあります。"));
    } else {
      b.appendChild(el("p", "hint", "公式ページのリンクはまだ登録されていません。"));
    }
    d.appendChild(b);
    return d;
  }

  // ---- 日付ごとにまとめる ----
  function byDay(events, from, to) {
    var muni = sel.value;
    var days = {}, ongoing = [];
    events.forEach(function (ev) {
      if (muni && ev.area !== muni) return;
      if (ev.e < from || ev.s > to) return;
      if (ev.long) {
        if (ev.s < from) ongoing.push(ev);
        else (days[ev.s] = days[ev.s] || []).push(ev);
        return;
      }
      for (var d = toDate(ev.s), end = toDate(ev.e); d <= end; d = addDays(d, 1)) {
        var k = iso(d);
        if (k >= from && k <= to) (days[k] = days[k] || []).push(ev);
      }
    });
    return { days: days, ongoing: ongoing };
  }

  function daySection(k, evs) {
    var d = toDate(k), w = d.getDay();
    var sec = el("section", "day");
    sec.id = "d-" + k;
    var head = el("div", "day-head");
    var badge = el("div", "badge" + (w === 6 ? " sat" : w === 0 ? " sun" : ""));
    badge.appendChild(el("span", "md", (d.getMonth() + 1) + "/" + d.getDate()));
    badge.appendChild(el("span", "wd", WD[w] + "曜日"));
    head.appendChild(badge);
    var note = k === today ? "きょう" : k === tomorrow ? "あした" : k < today ? d.getFullYear() + "年・終了" : "";
    head.appendChild(el("span", "day-note", (note ? note + "・" : "") + evs.length + "件"));
    sec.appendChild(head);
    var p = el("div", "panel");
    evs.forEach(function (ev) { p.appendChild(eventNode(ev, k)); });
    sec.appendChild(p);
    return sec;
  }

  function ongoingBlock(title, evs) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("h2", "sec-title", title));
    var p = el("div", "panel");
    evs.forEach(function (ev) { p.appendChild(eventNode(ev)); });
    frag.appendChild(p);
    return frag;
  }

  function emptyBox(text) { list.appendChild(el("div", "empty", text)); }

  // ---- 日付ごとの一覧（これからの予定） ----
  function renderList() {
    var data = byDay(DATA.events, today, "9999-12-31");
    if (data.ongoing.length) list.appendChild(ongoingBlock("開催中（長く続くイベント）", data.ongoing));
    var keys = Object.keys(data.days).sort();
    keys.forEach(function (k) { list.appendChild(daySection(k, data.days[k])); });
    if (!keys.length && !data.ongoing.length) emptyBox("いま登録されているイベントはありません。");
  }

  // ---- データの読み込み（月ごと・検索用） ----
  var monthCache = {}, allData = null, allLoading = null;
  function loadJSON(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function loadMonth(key) {
    if (monthCache[key]) return Promise.resolve(monthCache[key]);
    if ((DATA.months || []).indexOf(key) < 0) return Promise.resolve([]);
    return loadJSON("data/" + key + ".json?v=" + encodeURIComponent(DATA.updated))
      .then(function (evs) { monthCache[key] = evs; return evs; });
  }
  function loadAll() {
    if (allData) return Promise.resolve(allData);
    if (!allLoading) {
      allLoading = loadJSON("data/all.json?v=" + encodeURIComponent(DATA.updated))
        .then(function (evs) { allData = evs; return evs; })
        .catch(function (e) { allLoading = null; throw e; });
    }
    return allLoading;
  }

  // ---- 月のカレンダー ----
  var calMonth = null;   // 表示中の月（1日）
  var selDay = null;     // 選んでいる日
  var token = 0;         // 古い読み込み結果で上書きしないための番号

  function monthKey(d) { return d.getFullYear() * 12 + d.getMonth(); }
  function ym(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2); }
  function fromYm(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, 1); }

  function renderCal(scrollToDay) {
    var first = fromYm(DATA.first || ym(now)), last = fromYm(DATA.last || ym(now));
    if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    if (monthKey(calMonth) < monthKey(first)) calMonth = first;
    if (monthKey(calMonth) > monthKey(last)) calMonth = last;
    var my = token;
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    var from = iso(new Date(y, m, 1)), to = iso(new Date(y, m + 1, 0));

    calBox.appendChild(el("div", "cal", "読み込み中…"));
    loadMonth(ym(calMonth)).then(function (evs) {
      if (my !== token) return;
      calBox.textContent = "";
      var data = byDay(evs, from, to);
      var keys = Object.keys(data.days).sort();
      if (!selDay || selDay < from || selDay > to || !data.days[selDay]) {
        var future = keys.filter(function (k) { return k >= today; });
        selDay = future[0] || keys[0] || null;
      }

      var box = el("div", "cal");
      var head = el("div", "cal-head");
      var prev = el("button", "", "◀ 前の月");
      var next = el("button", "", "次の月 ▶");
      prev.type = next.type = "button";
      prev.disabled = monthKey(calMonth) <= monthKey(first);
      next.disabled = monthKey(calMonth) >= monthKey(last);
      prev.onclick = function () { calMonth = new Date(y, m - 1, 1); selDay = null; render(); };
      next.onclick = function () { calMonth = new Date(y, m + 1, 1); selDay = null; render(); };
      head.appendChild(prev);
      head.appendChild(el("h2", "", y + "年" + (m + 1) + "月"));
      head.appendChild(next);
      box.appendChild(head);

      var grid = el("div", "grid");
      WD.forEach(function (w, i) { grid.appendChild(el("div", "wk" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), w)); });
      for (var b = 0; b < calMonth.getDay(); b++) grid.appendChild(el("div", "cell blank"));
      var dim = new Date(y, m + 1, 0).getDate();
      for (var day = 1; day <= dim; day++) {
        var d = new Date(y, m, day), k = iso(d), w = d.getDay(), dayEvs = data.days[k] || [];
        var cls = "cell" + (w === 0 ? " sun" : w === 6 ? " sat" : "") + (k < today && !dayEvs.length ? " past" : "") +
                  (k === today ? " today" : "") + (dayEvs.length ? " has" : "") + (k === selDay ? " sel" : "");
        var c = el(dayEvs.length ? "button" : "div", cls);
        c.appendChild(el("span", "num", String(day)));
        if (dayEvs.length) {
          c.type = "button";
          c.setAttribute("aria-label", (m + 1) + "月" + day + "日 " + dayEvs.length + "件");
          var dots = el("span", "dots");
          dayEvs.slice(0, 6).forEach(function (ev) {
            var dot = el("span", "dot");
            dot.style.setProperty("--c", ev.color);
            dots.appendChild(dot);
          });
          c.appendChild(dots);
          c.appendChild(el("span", "cnt", dayEvs.length + "件"));
          c.onclick = (function (key) { return function () { selDay = key; render(true); }; })(k);
        }
        grid.appendChild(c);
      }
      box.appendChild(grid);
      box.appendChild(el("p", "cal-note", "日付を押すと、その日のイベントが下に出ます。点の色は市町村の色です。過去の月もさかのぼって見られます。"));
      calBox.appendChild(box);

      if (selDay) list.appendChild(daySection(selDay, data.days[selDay]));
      else emptyBox("この月に登録されているイベントはありません。");
      var longOnDay = evs.filter(function (ev) {
        return ev.long && selDay && ev.s < selDay && ev.e >= selDay && (!sel.value || ev.area === sel.value);
      });
      if (longOnDay.length) list.appendChild(ongoingBlock("この日も開催中（長く続くイベント）", longOnDay));
      if (scrollToDay && selDay) {
        var target = document.getElementById("d-" + selDay);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }).catch(function () {
      if (my !== token) return;
      calBox.textContent = "";
      emptyBox("読み込めませんでした。通信のよい場所で、もう一度開いてください。");
    });
  }

  // ---- 検索 ----
  var qInput = document.getElementById("q"), qClear = document.getElementById("q-clear");
  var PAST_STEP = 30, pastShown = PAST_STEP;

  function norm(s) {
    s = (s || "").normalize ? s.normalize("NFKC") : (s || "");
    s = s.toLowerCase().replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); });
    return s.replace(/[\s・･\-ー－〜~「」『』【】（）()]/g, "");
  }

  function dateLabel(ev) {
    var s = toDate(ev.s), t = s.getFullYear() + "年" + (s.getMonth() + 1) + "月" + s.getDate() + "日（" + WD[s.getDay()] + "）";
    if (ev.e !== ev.s) { var e = toDate(ev.e); t += "〜" + (e.getMonth() + 1) + "月" + e.getDate() + "日（" + WD[e.getDay()] + "）"; }
    return t;
  }

  function renderSearch(q) {
    var my = token;
    list.appendChild(el("p", "result-note", "検索中…"));
    loadAll().then(function (all) {
      if (my !== token) return;
      list.textContent = "";
      var words = q.split(/[\s　]+/).map(norm).filter(Boolean);
      var muni = sel.value;
      var hits = all.filter(function (ev) {
        if (muni && ev.area !== muni) return false;
        var hay = norm(ev.tag + ev.muni + ev.area + ev.name);
        return words.every(function (w) { return hay.indexOf(w) >= 0; });
      });
      var upcoming = hits.filter(function (ev) { return ev.e >= today; });
      var past = hits.filter(function (ev) { return ev.e < today; }).reverse();
      list.appendChild(el("p", "result-note", "「" + q + "」の検索結果：これから " + upcoming.length + "件／過去 " + past.length + "件"));
      function block(title, evs, isPast) {
        list.appendChild(el("h2", "sec-title", title));
        var p = el("div", "panel");
        evs.forEach(function (ev) {
          p.appendChild(el("div", "result-date" + (isPast ? " past" : ""), dateLabel(ev)));
          p.appendChild(eventNode(ev));
        });
        list.appendChild(p);
      }
      if (upcoming.length) block("これからのイベント", upcoming, false);
      if (past.length) {
        block("過去のイベント（新しい順）", past.slice(0, pastShown), true);
        if (past.length > pastShown) {
          var more = el("button", "btn sub more", "過去のイベントをもっと見る（残り" + (past.length - pastShown) + "件）");
          more.type = "button";
          more.onclick = function () { pastShown += PAST_STEP; render(); };
          list.appendChild(more);
        }
      }
      if (!hits.length) emptyBox("見つかりませんでした。言葉を短くするか、市町村を「すべて」にして試してください。");
    }).catch(function () {
      if (my !== token) return;
      list.textContent = "";
      emptyBox("読み込めませんでした。通信のよい場所で、もう一度検索してください。");
    });
  }

  var timer = null;
  qInput.addEventListener("input", function () {
    qClear.hidden = !qInput.value;
    clearTimeout(timer);
    timer = setTimeout(function () { pastShown = PAST_STEP; render(); }, 250);
  });
  document.getElementById("search-form").addEventListener("submit", function (e) {
    e.preventDefault(); qInput.blur(); pastShown = PAST_STEP; render();
  });
  qClear.addEventListener("click", function () {
    qInput.value = ""; qClear.hidden = true; render(); qInput.focus();
  });

  // ---- 表示の切り替え ----
  var calBox = document.getElementById("cal");
  var btnList = document.getElementById("v-list"), btnCal = document.getElementById("v-cal");
  var viewsBox = document.querySelector(".views");
  var view = "list";
  try { if (localStorage.getItem("iwate-view") === "cal") view = "cal"; } catch (e) {}

  function render(scrollToDay) {
    token++;
    list.textContent = "";
    calBox.textContent = "";
    var q = qInput.value.trim();
    viewsBox.style.display = q ? "none" : "";
    btnList.setAttribute("aria-pressed", String(view === "list"));
    btnCal.setAttribute("aria-pressed", String(view === "cal"));
    if (q) renderSearch(q);
    else if (view === "cal") renderCal(scrollToDay);
    else renderList();
  }

  function setView(v) {
    view = v;
    try { localStorage.setItem("iwate-view", v); } catch (e) {}
    render();
  }
  btnList.addEventListener("click", function () { setView("list"); });
  btnCal.addEventListener("click", function () { setView("cal"); });

  var munis = {};
  (DATA.munis || []).forEach(function (m) { munis[m] = 0; });
  DATA.events.forEach(function (ev) { if (ev.area && ev.e >= today) munis[ev.area] = (munis[ev.area] || 0) + 1; });
  Object.keys(munis).sort(function (a, b) { return munis[b] - munis[a] || a.localeCompare(b, "ja"); }).forEach(function (m) {
    var o = el("option", "", munis[m] ? m + "（これから" + munis[m] + "件）" : m);
    o.value = m;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function () { selDay = null; pastShown = PAST_STEP; render(); });

  if (DATA.updated) {
    var u = DATA.updated.split(" "), ud = u[0].split("-");
    document.getElementById("updated").textContent = (+ud[1]) + "月" + (+ud[2]) + "日 " + (u[1] || "") + " 更新（毎日 5時・12時・18時に自動更新）";
  }
  render();
})();
</script>
</body>
</html>
